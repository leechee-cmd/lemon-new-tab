# Cloudflare Pages 项目配置
# 部署入口：Cloudflare Pages（Git 集成），构建命令 `pnpm run build`，输出目录 `dist-web`。
name = "lemon-new-tab"
compatibility_date = "2026-08-31"
pages_build_output_dir = "dist-web"

# 设置同步用 KV 绑定在 Cloudflare 控制台配置（Pages 项目 → Settings → Functions →
# KV namespace bindings，variable name = SYNC_KV），不要在 wrangler.toml 重复声明。
# 如需本地 `wrangler pages dev` 联调，请临时在此追加：
#   [[kv_namespaces]]
#   binding = "SYNC_KV"
#   id = "<真实 namespace id>"