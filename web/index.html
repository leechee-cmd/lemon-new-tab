<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./icon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://sdk.jinrishici.com https://suggestion.baidu.com https://suggestqueries.google.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: http:;
        connect-src 'self' http: https: ws:;
        worker-src 'self'
      "
    />
    <script src="./theme-init.js"></script>
    <style>
      html,
      html.light {
        background-color: #f2f3f5;
        background-image: linear-gradient(160deg, #eef2f7 0%, #e2e8f1 45%, #d5dce8 100%);
      }

      html.light {
        color-scheme: light;
      }

      html.dark {
        color-scheme: dark;
        background-color: #0a0a0a;
        background-image: linear-gradient(160deg, #14181f 0%, #0c0f14 45%, #070a0e 100%);
      }

      @media (prefers-color-scheme: light) {
        html:not(.dark, .light) {
          color-scheme: light;
          background-color: #f2f3f5;
          background-image: linear-gradient(160deg, #eef2f7 0%, #e2e8f1 45%, #d5dce8 100%);
        }
      }

      @media (prefers-color-scheme: dark) {
        html:not(.dark, .light) {
          color-scheme: dark;
          background-color: #0a0a0a;
          background-image: linear-gradient(160deg, #14181f 0%, #0c0f14 45%, #070a0e 100%);
        }
      }
    </style>
    <style>
      .startup-fallback {
        box-sizing: border-box;
        max-width: 720px;
        padding: 16px;
        margin: 24px auto;
        font:
          14px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;
        color: #c45656;
        background: #fff5f5;
        border: 1px solid #f56c6c;
        border-radius: 8px;
      }

      .startup-fallback[hidden] {
        display: none;
      }

      .startup-fallback pre {
        margin: 0 0 16px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .startup-fallback a {
        display: inline-block;
        padding: 8px 12px;
        color: #fff;
        text-decoration: none;
        background: #409eff;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main id="startup-fallback" class="startup-fallback" hidden>
      <pre>Lemon New Tab startup failed.</pre>
      <a href="">Reload page</a>
    </main>
  </body>
  <script type="module" src="./main.web.ts"></script>
</html>
